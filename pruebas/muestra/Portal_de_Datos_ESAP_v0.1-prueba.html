function tabla(cols, filas, opts = {}) {
  const id = "t" + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    el.querySelectorAll("th").forEach((th, i) => th.onclick = () => {
      const tb = el.tBodies[0], rs = [...tb.rows], dir = th.dataset.dir === "a" ? "d" : "a";
      el.querySelectorAll("th").forEach(x => delete x.dataset.dir); th.dataset.dir = dir;
      rs.sort((a, b) => { const x = a.cells[i].dataset.v ?? a.cells[i].textContent, y = b.cells[i].dataset.v ?? b.cells[i].textContent;
        const nx = parseFloat(x), ny = parseFloat(y), r = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y, "es");
        return dir === "a" ? r : -r; });
      rs.forEach(r => tb.appendChild(r));
    });
  });
  const head = cols.map(c => `<th class="${c.r ? "r" : ""}">${c.t}</th>`).join("");
  const body = filas.length ? filas.map(f => "<tr>" + cols.map((c, i) => {
    const v = f[i]; const val = (v && typeof v === "object") ? v : {h: v};
    return `<td class="${c.r ? "r" : ""}"${val.v !== undefined ? ` data-v="${esc(val.v)}"` : ""}>${val.h ?? ""}</td>`; }).join("") + "</tr>").join("")
    : `<tr><td colspan="${cols.length}" class="empty">Sin elementos</td></tr>`;
  return `<div class="wrap"><table class="tbl" id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function csv(nombre, cab, filas) {
  const q = v => { v = v == null ? "" : String(v); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const txt = "﻿" + [cab, ...filas].map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type: "text/csv;charset=utf-8"}));
  a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  const colHits = q ? lista.flatMap(([key, t]) => t.cols.filter(c => c.n.toLowerCase().includes(q) || (c.d || "").toLowerCase().includes(q)).map(c => [key, c])) : [];

    colHits.slice(0, 500).map(([key, c]) => [tlink(key), `<span class="mono">${esc(c.n)}</span>`, `<span class="mono muted">${esc(c.ty)}</span>`, desc(c.d, c.de)])) : ""}`;
};

V.tabla = (p, key) => {

  const fkOut = t.fk_out.map(n => fkByName[key + "|" + n]).filter(Boolean);
  const fkIn = D.fks.filter(f => f.p === key);
  const impOut = t.imp_out.map(i => D.implicitas[i]), impIn = t.imp_in.map(i => D.implicitas[i]);
  const P = {
    columnas: () => tabla([{t:"#",r:1},{t:"Columna"},{t:"Tipo"},{t:"Nulos"},{t:"Descripción"},{t:"Claves y marcas"}],
      t.cols.map((c, i) => [i + 1, `<span class="mono"><b>${esc(c.n)}</b></span>`, `<span class="mono muted">${esc(c.ty)}</span>${c.def ? `<div class="mono soft" style="font-size:11px">= ${esc(c.def)}</div>` : ""}`,
        {h: (c.nul ? "admite" : "<b>obligatoria</b>") + (c.nf != null && c.nul ? `<div class="soft" style="font-size:11px">${pct(c.nf, 1)} % nulos</div>` : ""), v: c.nf ?? -1},
        desc(c.d, c.de),
        [c.pk ? '<span class="tag t-brand">PK</span>' : "", c.uq ? '<span class="tag">única</span>' : "", c.ident ? '<span class="tag">identity</span>' : "",
         c.fk ? `<span class="tag t-ok" title="FK declarada">FK → ${tlink(c.fk.split(".").slice(0, 2).join("."))}</span>` : "",
         c.imp ? `<span class="tag t-info" title="Relación implícita por nombre, sin FK declarada">↝ ${tlink(c.imp.split(".").slice(0, 2).join("."))}</span>` : "",
         c.pii ? `<span class="tag t-warn" title="Clasificación por nombre de columna (Ley 1581 de 2012)">${esc(c.pii.cat)}</span>` : ""].join("")])),
    relaciones: () => `<h3>Referencia a (${fkOut.length + impOut.length})</h3>` + tabla([{t:"Columna"},{t:"Tabla destino"},{t:"Tipo"},{t:"Multiplicidad"},{t:"Medición"}],
        [...fkOut.map(f => [`<span class="mono">${esc(f.cols.join(", "))}</span>`, tlink(f.p), `<span class="tag t-ok">FK</span> <span class="mono soft">${esc(f.n)}</span>`,
          `<span class="mono">${esc(f.mh)} → ${esc(f.mp)}</span>`, f.filas != null ? `${fmt(f.nn)} con valor · ${fmt(f.dist)} padres distintos${INT && f.huerf ? ` · <b>${fmt(f.huerf)} sin padre</b>` : ""}` : '<span class="soft">FK compuesta: sin medición</span>']),
         ...impOut.map(i => [`<span class="mono">${esc(i.col)}</span>`, tlink(i.p), `<span class="tag t-info">implícita</span> <span class="soft">${esc(i.regla)}</span>`, "—",
          `${fmt(i.ok)} de ${fmt(i.nn)} valores encuentran su padre (${String(i.cob).replace(".", ",")} %)`])])
      + `<h3>Es referenciada por (${fkIn.length + impIn.length})</h3>` + tabla([{t:"Tabla origen"},{t:"Columna"},{t:"Tipo"},{t:"Multiplicidad"}],
        [...fkIn.map(f => [tlink(f.c), `<span class="mono">${esc(f.cols.join(", "))}</span>`, '<span class="tag t-ok">FK</span>', `<span class="mono">${esc(f.mp)} → ${esc(f.mh)}</span>`]),
         ...impIn.map(i => [tlink(i.c), `<span class="mono">${esc(i.col)}</span>`, '<span class="tag t-info">implícita</span>', "—"])]),
    indices: () => tabla([{t:"Índice"},{t:"Columnas"},{t:"Tipo"},{t:"Tamaño",r:1},{t:"Usos",r:1}],
        t.idx.map(i => [`<span class="mono">${esc(i.n)}</span>`, `<span class="mono">${esc(i.cols.join(", "))}</span>`, i.pk ? "clave primaria" : i.uni ? "único" : "no único", {h: bytes(i.bytes), v: i.bytes}, fmt(i.usos)]))
      + (t.uq.length || t.ck.length ? `<h3>Restricciones</h3>` + tabla([{t:"Nombre"},{t:"Definición"}], [...t.uq.map(u => [`<span class="mono">${esc(u.n)}</span>`, `UNIQUE (${esc(u.cols.join(", "))})`]), ...t.ck.map(c => [`<span class="mono">${esc(c.n)}</span>`, `<span class="mono">${esc(c.def)}</span>`])]) : ""),
    uso: () => `<h3>Triggers (${t.trg.length})</h3>` + tabla([{t:"Trigger"},{t:"Función"},{t:"Estado"},{t:"Definición"}], t.trg.map(g => [`<span class="mono">${esc(g.n)}</span>`, `<span class="mono">${esc(g.fn)}</span>`, g.estado, `<span class="mono soft" style="font-size:11px">${esc(g.def)}</span>`]))
      + `<h3>Funciones y procedimientos que la mencionan (${t.prog.length})</h3>` + (t.prog.length ? t.prog.map(x => `<span class="tag mono">${esc(x)}</span>`).join(" ") : '<span class="soft">Ninguno</span>')
      + `<h3>Vistas que la usan (${t.usada_por.length})</h3>` + (t.usada_por.length ? t.usada_por.map(tlink).join(", ") : '<span class="soft">Ninguna</span>')

  };
  setTimeout(() => document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { history.replaceState(null, "", `#tabla/${encodeURIComponent(key)}?p=${b.dataset.p}`); ruta(true); }));

  return `<div class="muted" style="font-size:12px"><a href="#dominios">Dominios</a> › <a href="#catalogo?s=${t.s}">${esc(dom(t.s))}</a></div>
  <div class="ficha-h"><h1 class="mono">${esc(t.s)}.<b>${esc(t.t)}</b></h1><span class="tag">${t.tipo}</span>${t.apoyo ? '<span class="tag">tabla de apoyo</span>' : ""}</div>

    <div><b>${fkOut.length}/${fkIn.length}</b>FK salen/entran</div><div><b>${impOut.length + impIn.length}</b>implícitas</div><div><b>${t.idx.length}</b>índices</div><div><b>${pii}</b>columnas con datos personales</div><div><b>${bytes(t.bytes)}</b>tamaño</div></div>
  <div class="tabs">${[["columnas","Columnas"],["relaciones","Relaciones"],["indices","Índices y restricciones"],["uso","Uso y linaje"]].map(([k, l]) => `<button data-p="${k}" class="${k === pestana ? "on" : ""}">${l}</button>`).join("")}

  ${(P[pestana] || P.columnas)()}`;
};

V.modelo = (p, s) => {

  setTimeout(() => dibujarER(s, foco, conApoyo));
  return `<h1>Modelo entidad-relación</h1>
  <div class="tools"><select id="es">${D.esquemas.map(e => `<option value="${e.s}"${e.s === s ? " selected" : ""}>${esc(e.nombre)} · ${e.tablas} tablas</option>`).join("")}</select>
    <label class="muted"><input type="checkbox" id="ap"${conApoyo ? " checked" : ""}> incluir tablas de apoyo</label>
    <button id="ajus">Ajustar a la vista</button><button id="svgx">Descargar SVG</button></div>
  <div class="legend"><span><svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="currentColor" stroke-width="1.6"/></svg>FK declarada</span>
    <span><svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/></svg>relación implícita</span>
    <span><span class="tag">tabla de otro dominio</span></span><span class="mono">0..* → 1</span> multiplicidad hijo → padre</div>
  <div class="er" id="er"><div class="hint">Rueda: acercar · arrastrar: mover · clic en una tabla: abrir su ficha</div></div>`;
};
function dibujarER(s, foco, conApoyo) {
  const css = getComputedStyle(document.documentElement), C = k => css.getPropertyValue(k).trim();
  $("#es").onchange = e => location.hash = "#modelo/" + e.target.value + (conApoyo ? "?apoyo=1" : "");
  $("#ap").onchange = e => location.hash = "#modelo/" + s + (e.target.checked ? "?apoyo=1" : "");
  const propias = Object.keys(T).filter(k => T[k].s === s && "rpf".includes(T[k].k) && !T[k].particion && (conApoyo || !T[k].apoyo));
  const set = new Set(propias), aristas = [];
  D.fks.forEach(f => { if (set.has(f.c) || set.has(f.p)) aristas.push({a: f.c, b: f.p, imp: false, lbl: f.mh + " → " + f.mp, cols: f.cols}); });
  D.implicitas.forEach(i => { if ((set.has(i.c) || set.has(i.p)) && i.nn) aristas.push({a: i.c, b: i.p, imp: true, lbl: "", cols: [i.col]}); });
  const ext = [...new Set(aristas.flatMap(e => [e.a, e.b]).filter(k => !set.has(k)))];
  const nodos = [...propias, ...ext].map((k, i) => {
    const t = T[k] || {t: k, cols: [], pk: []}, ajenas = !set.has(k);
    const marcadas = ajenas ? [] : t.cols.filter(c => c.pk || c.fk || c.imp);
    const filas = marcadas.slice(0, 9), w = Math.max(150, Math.min(260, 9 + 7.2 * Math.max((ajenas ? k : t.t).length, ...filas.map(c => c.n.length + 4))));
    const h = 28 + filas.length * 17 + (marcadas.length > 9 ? 17 : 0) + (ajenas ? 0 : 17);
    return {k, t, ajenas, filas, mas: marcadas.length - filas.length, w, h, x: Math.cos(i * 2.4) * 40 * Math.sqrt(i + 1), y: Math.sin(i * 2.4) * 40 * Math.sqrt(i + 1), vx: 0, vy: 0};
  });
  const idx = Object.fromEntries(nodos.map((n, i) => [n.k, i]));
  const conectados = new Set(aristas.flatMap(e => [e.a, e.b]));
  const libres = nodos.filter(n => !conectados.has(n.k)), red = nodos.filter(n => conectados.has(n.k));
  for (let it = 0; it < 450; it++) {
    const temp = 1 - it / 450;
    for (let i = 0; i < red.length; i++) for (let j = i + 1; j < red.length; j++) {
      const a = red[i], b = red[j]; let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const min = (a.w + b.w) / 2 * .75 + (a.h + b.h) / 2 * .75 + 40, f = d < min ? (min - d) * .5 : 9000 / (d * d);
      dx /= d; dy /= d; a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
    aristas.forEach(e => { const a = nodos[idx[e.a]], b = nodos[idx[e.b]]; if (a === b) return; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, f = (d - 260) * .02;
      a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; });
    red.forEach(n => { n.vx -= n.x * .004; n.vy -= n.y * .004; n.x += Math.max(-40, Math.min(40, n.vx)) * temp; n.y += Math.max(-40, Math.min(40, n.vy)) * temp; n.vx *= .5; n.vy *= .5; });
  }
  let minX = Math.min(0, ...red.map(n => n.x - n.w / 2)), maxY = Math.max(0, ...red.map(n => n.y + n.h / 2)), maxX = Math.max(600, ...red.map(n => n.x + n.w / 2));
  const cols = Math.max(1, Math.floor((maxX - minX) / 240)); let fila = 0, alto = 0;
  libres.forEach((n, i) => { if (i && i % cols === 0) { fila += alto + 30; alto = 0; } n.x = minX + (i % cols) * 240 + n.w / 2; n.y = maxY + 90 + fila + n.h / 2; alto = Math.max(alto, n.h); });
  const borde = (n, x, y) => { const dx = x - n.x, dy = y - n.y, sx = (n.w / 2) / Math.abs(dx || 1e-9), sy = (n.h / 2) / Math.abs(dy || 1e-9), s2 = Math.min(sx, sy); return [n.x + dx * s2, n.y + dy * s2]; };
  const NS = "http://www.w3.org/2000/svg";
  let svg = `<svg xmlns="${NS}" id="ersvg" font-family="Segoe UI, system-ui, sans-serif"><g id="vp">`;
  aristas.forEach(e => { const a = nodos[idx[e.a]], b = nodos[idx[e.b]];
    if (a === b) { svg += `<path d="M${a.x + a.w / 2} ${a.y - 8} c40 -10 40 26 0 16" fill="none" stroke="${C("--soft")}" stroke-width="1.4"${e.imp ? ' stroke-dasharray="5 4"' : ""}/>`; return; }
    const [x1, y1] = borde(a, b.x, b.y), [x2, y2] = borde(b, a.x, a.y);
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${e.imp ? C("--info") : C("--soft")}" stroke-width="1.4"${e.imp ? ' stroke-dasharray="5 4"' : ""}><title>${esc(e.a)} (${esc(e.cols.join(", "))}) → ${esc(e.b)}</title></line>`;
    svg += `<circle cx="${x2}" cy="${y2}" r="3" fill="${e.imp ? C("--info") : C("--soft")}"/>`;
    if (e.lbl) svg += `<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 4}" font-size="10" text-anchor="middle" fill="${C("--muted")}" stroke="${C("--panel")}" stroke-width="4" paint-order="stroke" font-family="Consolas, monospace">${esc(e.lbl)}</text>`; });
  nodos.forEach(n => {
    const x = n.x - n.w / 2, y = n.y - n.h / 2, f = n.k === foco;
    svg += `<g class="nd" data-k="${esc(n.k)}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${n.w}" height="${n.h}" rx="7" fill="${n.ajenas ? C("--panel2") : C("--panel")}" stroke="${f ? C("--brand2") : C("--line")}" stroke-width="${f ? 2.5 : 1.2}"${n.ajenas ? ' stroke-dasharray="4 3"' : ""}/>`;
    svg += `<rect x="${x}" y="${y}" width="${n.w}" height="24" rx="7" fill="${n.ajenas ? C("--panel2") : C("--brandbg")}"/><text x="${x + 9}" y="${y + 16}" font-size="12" font-weight="600" fill="${n.ajenas ? C("--muted") : C("--brand")}">${esc(n.ajenas ? n.k : n.t.t)}</text>`;
    n.filas.forEach((c, i) => { const yy = y + 40 + i * 17; svg += `<text x="${x + 9}" y="${yy}" font-size="11" fill="${C("--text")}" font-family="Consolas, monospace"><tspan fill="${c.pk ? C("--brand2") : c.fk ? C("--ok") : C("--info")}" font-weight="700">${c.pk ? "PK" : c.fk ? "FK" : "↝ "}</tspan> ${esc(c.n)}</text>`; });
    if (n.mas > 0) svg += `<text x="${x + 9}" y="${y + 40 + n.filas.length * 17}" font-size="11" fill="${C("--soft")}">… ${n.mas} más</text>`;
    if (!n.ajenas) svg += `<text x="${x + 9}" y="${y + n.h - 7}" font-size="10" fill="${C("--soft")}">${n.t.cols.length} col · ${n.t.filas == null ? "—" : fmt(n.t.filas)} filas</text>`;
    svg += `</g>`; });
  svg += `</g></svg>`;
  const cont = $("#er"); cont.insertAdjacentHTML("afterbegin", svg);
  const el = $("#ersvg"), vp = $("#vp"); let z = 1, tx = 0, ty = 0;
  const aplicar = () => vp.setAttribute("transform", `translate(${tx},${ty}) scale(${z})`);
  const ajustar = () => { const bb = vp.getBBox(), W = cont.clientWidth, H = cont.clientHeight; z = Math.min(1.4, Math.min(W / (bb.width + 60), H / (bb.height + 60)));
    const fn = foco && nodos[idx[foco]]; if (fn && z < .7) { z = .9; tx = W / 2 - fn.x * z; ty = H / 2 - fn.y * z; } else { tx = (W - bb.width * z) / 2 - bb.x * z; ty = (H - bb.height * z) / 2 - bb.y * z; } aplicar(); };
  ajustar(); $("#ajus").onclick = ajustar;
  el.addEventListener("wheel", e => { e.preventDefault(); const r = el.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    tx = mx - (mx - tx) * f; ty = my - (my - ty) * f; z *= f; aplicar(); }, {passive: false});
  let arr = null, movido = false;
  el.addEventListener("pointerdown", e => { arr = [e.clientX - tx, e.clientY - ty]; movido = false; });
  el.addEventListener("pointermove", e => { if (arr) { tx = e.clientX - arr[0]; ty = e.clientY - arr[1]; movido = true; aplicar(); } });
  el.addEventListener("pointerup", e => { const g = e.target.closest(".nd"); if (!movido && g && T[g.dataset.k]) location.hash = "#tabla/" + encodeURIComponent(g.dataset.k); arr = null; });
  $("#svgx").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([el.outerHTML], {type: "image/svg+xml"})); a.download = `modelo_er_${s}.svg`; a.click(); };
}

// ---------- enrutador
function ruta(mantenerScroll) {
  const h = decodeURIComponent(location.hash.slice(1)) || "inicio";
  const [camino, qs] = h.split("?"), arg = camino.split("/").slice(1).join("/");
  let vista = camino.split("/")[0];
  if (!INT && ["calidad", "identidad"].includes(vista)) vista = "inicio";
  const p = new URLSearchParams(qs || "");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === (vista === "tabla" ? "catalogo" : vista)));
  const foco = document.activeElement && document.activeElement.id, pos = foco === "q" ? document.activeElement.selectionStart : null;
  app.innerHTML = (V[vista] || V.inicio)(p, arg);
  if (foco === "q" && $("#q")) { $("#q").focus(); $("#q").setSelectionRange(pos, pos); }
  if (!mantenerScroll) scrollTo(0, 0);
}
addEventListener("hashchange", () => ruta());
ruta();
</script>
